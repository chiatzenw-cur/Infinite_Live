[project]
name = "infinity-live"
version = "0.1.0"
description = "Interactive AIGC live streaming for bilibili: 15s AI beats generated each minute from audience chat/superchat/vote."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "python-dotenv>=1.0",
]

[project.scripts]
infinity-live = "infinity_live.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infinity_live"]
